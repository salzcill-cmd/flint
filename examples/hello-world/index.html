<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Hello Flint!</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { font-family: system-ui, sans-serif; background: #f5f5f5; min-height: 100vh; display: flex; justify-content: center; align-items: center; }
    .container { text-align: center; background: white; padding: 3rem; border-radius: 16px; box-shadow: 0 4px 6px rgba(0,0,0,0.1); }
    h1 { color: #333; margin-bottom: 1rem; }
    p { color: #666; margin-bottom: 1.5rem; }
    .counter { display: flex; gap: 1rem; justify-content: center; align-items: center; }
    .counter button { padding: 0.75rem 1.5rem; font-size: 1.25rem; border: none; border-radius: 8px; cursor: pointer; background: #3b82f6; color: white; }
    .counter button:hover { background: #2563eb; }
    .counter span { font-size: 2rem; font-weight: bold; min-width: 3rem; }
  </style>
</head>
<body>
  <div id="app"></div>
  <script type="module" src="/src/main.jsx"></script>
</body>
</html>
